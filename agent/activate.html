<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Activate agent account &mdash; DataLogs GH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=20">
  <link rel="stylesheet" href="../css/agent.css?v=17">
</head>
<body class="agent-site plug-auth-page plug-activate-page">
  <div class="plug-auth-shell plug-auth-shell--single">
    <main class="plug-auth-main">
      <header class="plug-auth-top">
        <a class="plug-back" href="auth.html">&larr; Back to sign in</a>
      </header>

      <div class="plug-auth-card">
        <div class="plug-auth-brand">
          <img src="../assets/logo-mark.svg" alt="" width="44" height="44">
          <span class="plug-pill">Activation required</span>
          <h2 id="activate-title">Activate your vendor account</h2>
          <p id="activate-lede">Loading fee&hellip;</p>
        </div>

        <div id="activate-form-wrap" hidden>
          <form class="plug-form active form" id="activate-form">
            <label>Email for receipt
              <input type="email" id="activate-email" required placeholder="you@email.com">
            </label>
            <div class="pay-methods" id="activate-methods">
              <button class="pay-method selected" type="button" data-activate-method="momo"><span class="pay-ico" aria-hidden="true">Mo</span><strong>MoMo</strong><span class="hint">MTN, Telecel, AT</span></button>
              <button class="pay-method" type="button" data-activate-method="card"><span class="pay-ico" aria-hidden="true">Cd</span><strong>Card</strong><span class="hint">Visa or Mastercard</span></button>
            </div>
            <div id="activate-momo-fields">
              <p class="hint" style="margin:8px 0 6px">Pay with</p>
              <div class="pay-nets" id="activate-nets">
                <button class="pay-net mtn selected" type="button" data-activate-provider="mtn"><span class="pay-net-mark">MTN</span><strong>MTN MoMo</strong></button>
                <button class="pay-net telecel" type="button" data-activate-provider="telecel"><span class="pay-net-mark">TEL</span><strong>Telecel</strong></button>
                <button class="pay-net airteltigo" type="button" data-activate-provider="airteltigo"><span class="pay-net-mark">AT</span><strong>AT Money</strong></button>
              </div>
              <label>MoMo number<input type="tel" id="activate-momo-phone" required placeholder="024 123 4567"></label>
            </div>
            <div id="activate-card-fields" hidden>
              <label>Card number<input id="activate-card-number" inputmode="numeric" placeholder="ACCT-000015"></label>
              <div class="split card-expiry">
                <label>Month<input id="activate-card-month" maxlength="2" placeholder="MM"></label>
                <label>Year<input id="activate-card-year" maxlength="2" placeholder="YY"></label>
                <label>CVV<input id="activate-card-cvv" maxlength="4" placeholder="123"></label>
              </div>
            </div>
            <p class="error" id="activate-error" hidden></p>
            <button class="btn btn-primary btn-full plug-submit" type="submit" id="activate-submit">Pay to activate</button>
          </form>
        </div>

        <div class="plug-trust">
          <span>Instant unlock</span>
          <span>Full dashboard</span>
          <span>Store + wallet</span>
          <span>MoMo &amp; card</span>
        </div>

        <p class="plug-foot">
          <button class="btn btn-ghost" type="button" id="activate-signout">Sign out</button>
        </p>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="activate-modal" role="dialog" aria-modal="true">
    <div class="modal pay-popup" id="activate-popup"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/data.js?v=5"></script>
  <script src="../js/api.js?v=9"></script>
  <script src="../js/paystack.js?v=2"></script>
  <script src="../js/activate.js?v=3"></script>
</body>
</html>
