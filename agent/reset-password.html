<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reset password &mdash; DataLogs GH</title>
  <script>
    (function () {
      var hash = location.hash;
      if (!hash || hash.length < 2) return;
      var params = new URLSearchParams(hash.charAt(0) === "#" ? hash.slice(1) : hash);
      if (params.has("error") && !/\/agent\/reset-password\.html$/i.test(location.pathname)) {
        location.replace("/agent/reset-password.html" + hash + location.search);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=18">
  <link rel="stylesheet" href="../css/agent.css?v=20">
</head>
<body class="agent-site plug-auth-page">
  <div class="plug-auth-shell plug-auth-shell--single">
    <main class="plug-auth-main">
      <header class="plug-auth-top">
        <a class="plug-back" href="auth.html">&larr; Back to sign in</a>
      </header>

      <div class="plug-auth-card">
        <div class="plug-auth-brand">
          <img src="../assets/logo-mark.svg" alt="" width="44" height="44">
          <h2>Set a new password</h2>
          <p id="reset-lede">Choose a new password for your vendor account.</p>
        </div>

        <form class="plug-form active form" id="reset-form">
          <label class="password-field">New password
            <input type="password" name="password" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password">
            <button class="password-toggle" type="button" data-toggle-password>Show</button>
          </label>
          <label class="password-field">Confirm password
            <input type="password" name="confirm" required minlength="6" placeholder="Repeat password" autocomplete="new-password">
            <button class="password-toggle" type="button" data-toggle-password>Show</button>
          </label>
          <p class="error" id="reset-error" hidden></p>
          <button class="btn btn-primary btn-full plug-submit" type="submit" id="reset-submit">Update password</button>
        </form>

        <p class="plug-foot"><a href="auth.html">Request a new reset link</a></p>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/api.js?v=12"></script>
  <script>
    (async function () {
      const error = document.getElementById("reset-error");
      const form = document.getElementById("reset-form");
      const submit = document.getElementById("reset-submit");
      const lede = document.getElementById("reset-lede");

      document.querySelectorAll("[data-toggle-password]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const input = btn.parentElement.querySelector("input");
          const showing = input.type === "text";
          input.type = showing ? "password" : "text";
          btn.textContent = showing ? "Show" : "Hide";
        });
      });

      const access = await DataLogsAPI.waitForRecoverySession();
      if (!access.ok) {
        form.hidden = true;
        error.hidden = false;
        lede.textContent = "We could not open this reset link.";
        error.textContent = access.message;
        return;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.hidden = true;
        const data = Object.fromEntries(new FormData(form).entries());
        if (data.password !== data.confirm) {
          error.hidden = false;
          error.textContent = "Passwords do not match.";
          return;
        }
        submit.disabled = true;
        const result = await DataLogsAPI.updatePassword(data.password);
        if (!result.ok) {
          error.hidden = false;
          error.textContent = result.message;
          submit.disabled = false;
          return;
        }
        window.location.href = "auth.html?reset=1";
      });
    })();
  </script>
</body>
</html>
