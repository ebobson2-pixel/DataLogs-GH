<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>try{var d=document.documentElement,t=localStorage.getItem("datalogs_theme"),a=localStorage.getItem("datalogs_accent");if(t==="light")d.setAttribute("data-theme","light");if(a)d.setAttribute("data-accent",a);}catch(e){}</script>
  <title>Buy data &mdash; DataLogs GH</title>
  <meta name="description" content="Buy MTN, AirtelTigo and Telecel data packages. Browse all bundles and checkout in seconds.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=21">
</head>
<body data-page="packages">
  <div id="site-header"></div>
  <main id="main">
    <section class="page-hero">
      <div class="wrap">
        <p class="kicker">Buy data</p>
        <h1>Every bundle. Every network.</h1>
        <p>Choose MTN, AirtelTigo or Telecel, pick your GB size, enter the recipient number, and pay with MoMo or card.</p>
      </div>
    </section>
    <section class="section">
      <div class="wrap">
        <div class="filters" data-filter-group="#all-packages">
          <button class="filter-btn active" type="button" data-filter="all">All</button>
          <button class="filter-btn" type="button" data-filter="mtn">MTN</button>
          <button class="filter-btn" type="button" data-filter="airteltigo">AirtelTigo</button>
          <button class="filter-btn" type="button" data-filter="telecel">Telecel</button>
        </div>
        <label class="package-search-wrap">
          <span class="sr-only">Search packages</span>
          <input id="package-search" type="search" placeholder="Search e.g. MTN 10GB, Telecel 5GB…" autocomplete="off">
        </label>
        <div id="all-packages" data-packages="all" data-grouped></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <div id="checkout-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js?v=5"></script>
  <script src="js/customer-local.js?v=1"></script>
  <script src="js/receipt.js?v=1"></script>
  <script src="js/api.js?v=14"></script>
  <script src="js/whatsapp-fab.js?v=4"></script>
  <script src="js/order-tracker.js?v=13"></script>
  <script src="js/theme.js"></script>
  <script src="js/app.js?v=6"></script>
  <script src="js/paystack.js?v=1"></script>
  <script src="js/checkout.js?v=9"></script>
</body>
</html>
