<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>try{var d=document.documentElement,t=localStorage.getItem("datalogs_theme"),a=localStorage.getItem("datalogs_accent");if(t==="light")d.setAttribute("data-theme","light");if(a)d.setAttribute("data-accent",a);}catch(e){}</script>
  <title>Track transaction &mdash; DataLogs GH</title>
  <link rel="stylesheet" href="css/styles.css?v=20">
</head>
<body data-page="track">
  <div id="site-header"></div>
  <main id="main">
    <section class="page-hero">
      <div class="wrap">
        <p class="kicker">Track</p>
        <h1>Where is my data?</h1>
        <p>Enter your order code (e.g. DL-ABC12345) or the recipient phone number from checkout.</p>
      </div>
    </section>
    <section class="section">
      <div class="wrap track-page-card">
        <p class="hint">Use the <strong>Track order</strong> button at the bottom-right, or enter details below.</p>
        <form class="form track-page-form" id="track-page-form">
          <label>Order ID
            <input id="track-page-code" placeholder="DL-ABC12345" autocomplete="off">
          </label>
          <button class="btn btn-primary" type="submit">Track order</button>
        </form>
        <p class="hint track-page-divider">Or track by phone</p>
        <form class="form track-page-form" id="track-page-phone-form">
          <label>Recipient phone
            <input id="track-page-phone" inputmode="tel" placeholder="024 123 4567">
          </label>
          <button class="btn btn-primary" type="submit">Check status</button>
        </form>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js?v=5"></script>
  <script src="js/api.js?v=14"></script>
  <script src="js/order-tracker.js?v=7"></script>
  <script src="js/theme.js"></script>
  <script src="js/app.js?v=5"></script>
  <script>
    document.getElementById("track-page-form")?.addEventListener("submit", (e) => {
      e.preventDefault();
      const code = document.getElementById("track-page-code").value.trim();
      if (code) window.DataLogsTrack?.openWithCode?.(code);
    });
    document.getElementById("track-page-phone-form")?.addEventListener("submit", (e) => {
      e.preventDefault();
      window.DataLogsTrack?.open?.();
      const phone = document.getElementById("track-page-phone").value.trim();
      if (phone) {
        const input = document.getElementById("track-phone");
        if (input) input.value = phone;
        document.getElementById("track-form-phone")?.requestSubmit();
      }
    });
  </script>
</body>
</html>
