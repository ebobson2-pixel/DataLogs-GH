<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>try{document.documentElement.removeAttribute("data-theme");document.documentElement.setAttribute("data-accent","sea");}catch(e){}</script>
  <title>Agent store &mdash; DataLogs GH</title>
  <meta name="description" content="Buy MTN, AirtelTigo and Telecel data from an agent mini store.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=16">
  <link rel="stylesheet" href="css/store.css?v=13">
  <link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
</head>
<body class="store-body">
  <header class="site-header store-header">
    <div class="wrap nav">
      <a class="logo store-brand" href="#" id="store-brand-link" aria-label="Store home">
        <span class="logo-mark" aria-hidden="true"><img src="assets/logo-mark.svg" alt=""></span>
        <span id="store-top-name">Agent store</span>
      </a>
      <div class="store-header-right">
        <nav class="store-nav-tabs" id="store-nav-tabs" aria-label="Store menu" hidden>
          <a class="store-nav-tab" href="agent/auth.html">Agent</a>
          <a class="store-nav-tab" href="agent/dashboard.html">Dashboard</a>
          <a class="store-nav-tab" id="store-nav-call" href="#" hidden>Call</a>
          <a class="store-nav-tab store-nav-tab--wa" id="store-nav-wa" href="#" target="_blank" rel="noopener noreferrer" hidden>WhatsApp</a>
          <button class="store-nav-tab store-nav-tab--track" type="button" id="store-nav-track">Track order</button>
        </nav>
        <button class="store-menu-toggle" type="button" id="store-menu-toggle" aria-expanded="false" aria-controls="store-nav-tabs">
          <span class="store-menu-toggle-icon" aria-hidden="true"></span>
          <span class="store-menu-toggle-label">Menu</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="page-hero">
      <div class="wrap">
        <p class="kicker" id="store-kicker">Agent store</p>
        <h1 id="store-name">Loading&hellip;</h1>
        <p id="store-tagline">Faster and cheaper.</p>
        <p class="store-stats hint" id="store-stats">
          <span><strong id="store-pack-count">0</strong> plans</span>
          &middot;
          <span><strong id="store-net-count">3</strong> networks</span>
          &middot;
          <span>From <strong id="store-from-price">GH&#8373; 0.00</strong></span>
        </p>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div id="store-status" class="store-status" hidden></div>
        <div class="filters" id="store-filters" hidden></div>
        <div id="store-packages"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer store-footer" hidden>
    <div class="wrap footer-grid">
      <div>
        <div class="logo"><span class="logo-mark" aria-hidden="true"><img src="assets/logo-mark.svg" alt=""></span> <span id="store-foot-name">Agent store</span></div>
        <p class="intro" id="store-foot-agent">Powered by DataLogs GH</p>
      </div>
      <div>
        <strong>Help</strong>
        <p><a href="packages.html">Main shop</a></p>
        <p><a href="agent/auth.html">Become an agent</a></p>
        <p><a href="contact.html">Support</a></p>
      </div>
    </div>
    <div class="wrap footer-bottom">
      <span>&copy; <span id="store-year"></span> DataLogs GH.</span>
      <span class="footer-powered">POWERED BY FSTech</span>
    </div>
  </footer>

  <div id="checkout-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js?v=12"></script>
  <script src="js/order-tracker.js?v=4"></script>
  <script src="js/paystack.js?v=1"></script>
  <script src="js/checkout.js?v=5"></script>
  <script src="js/store.js?v=5"></script>
  <script>document.getElementById("store-year").textContent = new Date().getFullYear();</script>
</body>
</html>
